name: Build EXE with Nuitka

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Build EXE (folder mode)
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: hello.py
          mode: standalone   # standalone folder, NOT onefile

      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: hello-build
          path: build/*.dist/**
          include-hidden-files: true